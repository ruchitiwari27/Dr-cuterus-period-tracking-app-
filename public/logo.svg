<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="petalGradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB9C5"/>
      <stop offset="100%" stop-color="#FF6B9E"/>
    </linearGradient>
    <linearGradient id="petalGradSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FFB9C5"/>
    </linearGradient>
    <radialGradient id="bgCircle" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDDDE6"/>
      <stop offset="100%" stop-color="#F5C0CF"/>
    </radialGradient>
    <filter id="petalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Soft background circle -->
  <circle cx="70" cy="70" r="68" fill="url(#bgCircle)"/>
  <circle cx="70" cy="70" r="65" stroke="#FF8FB0" stroke-width="0.8" fill="none" opacity="0.25"/>

  <!-- Lotus petals — exactly matching CelestialBloomLogo paths, scaled 1.5x, centered at (70, 75) -->
  <g transform="translate(70, 76) scale(1.45)" filter="url(#petalGlow)">
    <!-- Center top petal: M 0 0 C -10 -20 0 -40 0 -40 C 0 -40 10 -20 0 0 Z -->
    <path d="M 0 0 C -10 -20 0 -40 0 -40 C 0 -40 10 -20 0 0 Z"
          fill="url(#petalGradTop)" stroke="#FF6B9E" stroke-width="0.6"/>

    <!-- Left side petal: M -2 -2 C -20 -15 -35 0 -35 0 C -35 0 -15 15 -2 -2 Z -->
    <path d="M -2 -2 C -20 -15 -35 0 -35 0 C -35 0 -15 15 -2 -2 Z"
          fill="#FFB9C5" stroke="#FF8FB0" stroke-width="0.6"/>

    <!-- Right side petal: M 2 -2 C 20 -15 35 0 35 0 C 35 0 15 15 2 -2 Z -->
    <path d="M 2 -2 C 20 -15 35 0 35 0 C 35 0 15 15 2 -2 Z"
          fill="#FFB9C5" stroke="#FF8FB0" stroke-width="0.6"/>

    <!-- Upper-left petal: M -1 -5 C -15 -25 -25 -25 -25 -25 C -25 -25 -5 -15 -1 -5 Z -->
    <path d="M -1 -5 C -15 -25 -25 -25 -25 -25 C -25 -25 -5 -15 -1 -5 Z"
          fill="url(#petalGradSide)" stroke="#FFB9C5" stroke-width="0.5"/>

    <!-- Upper-right petal: M 1 -5 C 15 -25 25 -25 25 -25 C 25 -25 5 -15 1 -5 Z -->
    <path d="M 1 -5 C 15 -25 25 -25 25 -25 C 25 -25 5 -15 1 -5 Z"
          fill="url(#petalGradSide)" stroke="#FFB9C5" stroke-width="0.5"/>

    <!-- Center stamen dot -->
    <circle cx="0" cy="0" r="3.5" fill="#FF6B9E" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.8" fill="#FF4085" opacity="0.7"/>
  </g>
</svg>
