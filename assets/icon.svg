<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="petalGradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB9C5"/>
      <stop offset="100%" stop-color="#FF6B9E"/>
    </linearGradient>
    <linearGradient id="petalGradSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FFB9C5"/>
    </linearGradient>
    <radialGradient id="bgCircle" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FDDDE6"/>
      <stop offset="100%" stop-color="#F5C0CF"/>
    </radialGradient>
    <filter id="petalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <g id="sparkle">
      <path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="white" fill-opacity="0.6"/>
    </g>
  </defs>

  <!-- Solid Background -->
  <rect width="1024" height="1024" fill="#F5D1DA" />

  <!-- Outer background circle -->
  <circle cx="512" cy="512" r="497" fill="url(#bgCircle)"/>
  <!-- Thin outer rings -->
  <circle cx="512" cy="512" r="475" stroke="#FF8FB0" stroke-width="6" fill="none" opacity="0.3"/>
  <circle cx="512" cy="512" r="330" stroke="#FF8FB0" stroke-width="4" fill="none" opacity="0.15"/>
  <circle cx="512" cy="512" r="200" stroke="#FF8FB0" stroke-width="3" fill="none" opacity="0.1"/>

  <!-- Sparkles -->
  <use href="#sparkle" transform="translate(180, 480) scale(3.5)" />
  <use href="#sparkle" transform="translate(840, 260) scale(2.5)" />
  <use href="#sparkle" transform="translate(750, 800) scale(1.5)" />
  <use href="#sparkle" transform="translate(300, 200) scale(1.5)" />

  <!-- Lotus Center -->
  <g transform="translate(512, 555) scale(10.6)" filter="url(#petalGlow)">
    <!-- Top -->
    <path d="M 0 0 C -10 -20 0 -40 0 -40 C 0 -40 10 -20 0 0 Z" fill="url(#petalGradTop)" stroke="#FF6B9E" stroke-width="0.6"/>
    <!-- Left -->
    <path d="M -2 -2 C -20 -15 -35 0 -35 0 C -35 0 -15 15 -2 -2 Z" fill="#FFB9C5" stroke="#FF8FB0" stroke-width="0.6"/>
    <!-- Right -->
    <path d="M 2 -2 C 20 -15 35 0 35 0 C 35 0 15 15 2 -2 Z" fill="#FFB9C5" stroke="#FF8FB0" stroke-width="0.6"/>
    <!-- Upper-left -->
    <path d="M -1 -5 C -15 -25 -25 -25 -25 -25 C -25 -25 -5 -15 -1 -5 Z" fill="url(#petalGradSide)" stroke="#FFB9C5" stroke-width="0.5"/>
    <!-- Upper-right -->
    <path d="M 1 -5 C 15 -25 25 -25 25 -25 C 25 -25 5 -15 1 -5 Z" fill="url(#petalGradSide)" stroke="#FFB9C5" stroke-width="0.5"/>

    <!-- Stamen -->
    <circle cx="0" cy="0" r="3.5" fill="#FF6B9E" opacity="0.9"/>
    <circle cx="0" cy="0" r="1.8" fill="#FF4085" opacity="0.7"/>
  </g>
</svg>
